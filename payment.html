
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Paiement | PROF IA MEDIA</title>
    <link rel="stylesheet" href="css/payment.css">
</head>

<body>
    <main class="container">
        <div class="card">

            <div class="brand">
                <div class="logo">🎓</div>
                <p>PROF IA MEDIA</p>
            </div>

            <div class="product">
                <span class="eyebrow">VOTRE FORMATION</span>

                <h1 id="productName">Chargement...</h1>

                <p id="productSubtitle" class="product-subtitle">
                    Chargement des informations...
                </p>

                <div id="productPrice" class="price">--</div>
                <p class="price-note">Paiement unique</p>
            </div>

            <!-- Conservé pour le script existant -->
            <section id="productDescriptionSection" hidden>
                <div id="productDescription"></div>
            </section>

            <div class="payment-area">
                <div class="secure">
                    <span>🔒</span>
                    Paiement sécurisé avec Jèko
                </div>

                <label for="paymentMethod">
                    Moyen de paiement
                </label>

                <select
                    id="paymentMethod"
                    name="paymentMethod"
                    required
                >
                    <option value="">Choisir un opérateur</option>
                    <option value="wave">Wave</option>
                    <option value="orange">Orange Money</option>
                    <option value="mtn">MTN Money</option>
                    <option value="moov">Moov Money</option>
                    <option value="djamo">Djamo</option>
                </select>

                <button
                    id="payButton"
                    type="button"
                    onclick="preparePayment()"
                >
                    PAYER MAINTENANT
                </button>

                <p class="payment-info">
                    Votre accès sera activé automatiquement après confirmation du paiement.
                </p>
            </div>

        </div>
    </main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CONFIGURATION -->
    <script src="js/config.js"></script>

    <!-- LOGIQUE DE PAIEMENT EXISTANTE -->
    <script src="js/payment.js"></script>

    <!-- CHARGEMENT DU PRODUIT DEPUIS SUPABASE -->
    <script>
    document.addEventListener("DOMContentLoaded", async () => {
        try {
            const params = new URLSearchParams(window.location.search);
            const productCode = params.get("product");

            if (!productCode) {
                document.getElementById("productName").textContent =
                    "Produit non spécifié";

                document.getElementById("productSubtitle").textContent =
                    "Veuillez sélectionner une formation.";

                return;
            }

            const { data: product, error } = await sb
                .from("products")
                .select(`
                    id,
                    product_name,
                    product_code,
                    description,
                    price,
                    currency,
                    status
                `)
                .eq("product_code", productCode)
                .eq("status", true)
                .maybeSingle();

            if (error) {
                console.error("Erreur chargement produit :", error);

                document.getElementById("productName").textContent =
                    "Erreur de chargement";

                document.getElementById("productSubtitle").textContent =
                    "Veuillez réessayer.";

                return;
            }

            if (!product) {
                document.getElementById("productName").textContent =
                    "Formation introuvable";

                document.getElementById("productSubtitle").textContent =
                    "Cette formation n'est pas disponible.";

                return;
            }

            document.getElementById("productName").textContent =
                product.product_name;

            document.getElementById("productSubtitle").textContent =
                "Accédez à votre formation en ligne";

            const price = Number(product.price).toLocaleString("fr-FR");
            const currency = product.currency || "XOF";

            document.getElementById("productPrice").textContent =
                price + " " + currency;

            document.getElementById("productDescription").textContent =
                product.description || "";

            document.title =
                product.product_name + " | PROF IA MEDIA";

            console.log("Produit chargé :", product);

        } catch (error) {
            console.error("Erreur générale :", error);

            document.getElementById("productName").textContent =
                "Une erreur est survenue";

            document.getElementById("productSubtitle").textContent =
                "Impossible de charger la formation.";
        }
    });
    </script>
</body>
</html>
