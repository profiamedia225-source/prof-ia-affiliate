<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gestion des Affiliés</title>

    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/admin-affiliates.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div id="sidebar-container"></div>

<main class="dashboard">

<header class="page-header">

<h1>👥 Gestion des Affiliés</h1>

<p>Administration complète des partenaires.</p>

</header>

<div class="toolbar">

<input
type="text"
id="searchAffiliate"
placeholder="Rechercher un affilié...">

</div>

<div class="table-card">

<table id="affiliatesTable">

<thead>

<tr>

<th>Nom</th>

<th>Email</th>

<th>Pays</th>

<th>Solde</th>

<th>Commissions</th>

<th>Statut</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

<!-- =========================
     MODAL FICHE AFFILIÉ
========================== -->

<div id="affiliateModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>👤 Fiche affilié</h2>

            <button id="closeModal">&times;</button>

        </div>

        <div id="affiliateDetails">

            Chargement...

        </div>

    </div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/admin-auth.js"></script>

<script src="js/admin-sidebar.js"></script>

<script src="js/admin-affiliates.js"></script>

</body>

</html>
