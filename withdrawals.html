<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Demandes de retrait</title>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="dashboard">

<div id="sidebar-container"></div>

    <main class="content">

        <header class="top-header">

            <h1>💳 Demandes de retrait</h1>

        </header>

<section class="cards">

    <div class="card">

        <h3>💰 Solde disponible</h3>

        <h2 id="availableBalance">

            0 FCFA

        </h2>

    </div>

</section>

<section class="profile-section">

    <h2>Nouvelle demande de retrait</h2>

    <form id="withdrawForm">

        <div class="form-group">

            <label>Montant à retirer</label>

            <input
                type="number"
                id="amount"
                placeholder="Ex : 20000"
                required
            >

        </div>

        <div class="form-group">

            <label>Méthode de paiement</label>

            <select id="method" required>

                <option value="">Choisir...</option>

                <option value="Wave">Wave</option>

                <option value="Orange Money">Orange Money</option>

                <option value="MTN Money">MTN Money</option>

                <option value="Moov Money">Moov Money</option>

                <option value="Virement bancaire">Virement bancaire</option>

            </select>

        </div>

<div class="form-group">

    <label id="paymentLabel">
    Numéro ou informations de paiement
</label>

    <input
        type="text"
        id="paymentDetails"
        placeholder="Ex : 0701234567 ou IBAN"
        required
    >

</div>

        <button type="submit" class="btn-primary">

            Envoyer la demande

        </button>

    </form>

</section>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/notificationService.js"></script>

<script src="js/theme.js"></script>

<script src="js/utils.js"></script>

<script src="js/auth.js"></script>

<script src="js/withdrawals.js"></script>

<script src="js/sidebar.js"></script>

</body>

</html>
