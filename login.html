
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07152f">

    <title>Connexion | PROF IA MEDIA</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 120, 255, .20), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(0, 255, 140, .13), transparent 35%),
                linear-gradient(135deg, #061126, #0b1d3d 55%, #061126);
        }

        .register-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .register-card {
            width: 100%;
            max-width: 440px;
            padding: 42px 35px;
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 24px;
            background: rgba(13, 31, 62, .88);
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            backdrop-filter: blur(14px);
            text-align: center;
        }

        .logo {
            display: block;
            width: 105px;
            height: 85px;
            object-fit: contain;
            margin: 0 auto 20px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 30px;
            font-weight: 800;
        }

        .register-card > p {
            color: #b9c9df;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 28px;
        }

        #loginForm {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #loginForm input {
            width: 100%;
            min-height: 54px;
            padding: 0 17px;
            border: 1px solid rgba(255,255,255,.17);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,.08);
            color: #fff;
            font-size: 16px;
            transition: .2s;
        }

        #loginForm input::placeholder {
            color: #aabbd2;
        }

        #loginForm input:focus {
            border-color: #00e676;
            box-shadow: 0 0 0 3px rgba(0,230,118,.12);
        }

        .btn-primary {
            width: 100%;
            min-height: 54px;
            margin-top: 5px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(100deg, #00d66b, #00f58b);
            color: #052d1b;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,230,118,.25);
        }

        .login-link {
            margin-top: 25px !important;
            margin-bottom: 0 !important;
            font-size: 14px !important;
        }

        .login-link a {
            color: #00ed83;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .brand-footer {
            margin-top: 28px;
            color: #8296b4;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .register-page {
                padding: 18px 14px;
            }

            .register-card {
                padding: 32px 22px;
                border-radius: 20px;
            }

            .logo {
                width: 90px;
                height: 72px;
                margin-bottom: 15px;
            }

            h1 {
                font-size: 26px;
            }

            .register-card > p {
                font-size: 14px;
            }

            #loginForm input,
            .btn-primary {
                min-height: 52px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<section class="register-page">

    <div class="register-card">

        <img
            src="images/logo.png"
            class="logo"
            alt="PROF IA MEDIA"
        >

        <h1>Bienvenue !</h1>

        <p>
            Connectez-vous à votre espace PROF IA MEDIA
            pour retrouver vos formations et votre activité.
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Adresse e-mail"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Mot de passe"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="btn-primary"
            >
                Se connecter
            </button>

        </form>

        <p class="login-link">
            Pas encore inscrit ?
            <a href="register.html?product=formation_complete">
                Créer un compte
            </a>
        </p>

        <div class="brand-footer">
            © 2026 PROF IA MEDIA — Tous droits réservés.
        </div>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
