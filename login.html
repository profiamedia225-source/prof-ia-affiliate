
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07152f">

    <title>Connexion | PROF IA MEDIA</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 120, 255, .20), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(0, 255, 140, .13), transparent 35%),
                linear-gradient(135deg, #061126, #0b1d3d 55%, #061126);
        }

        .login-page {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 18px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            min-width: 0;
            margin: auto;
            padding: 42px 36px;
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 24px;
            background: rgba(13, 31, 62, .92);
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
        }

        .login-logo {
            display: block;
            width: 110px;
            height: 90px;
            max-width: 100%;
            object-fit: contain;
            margin: 0 auto 20px;
        }

        .login-card h1 {
            margin: 0 0 14px;
            color: #fff;
            font-size: 30px;
            line-height: 1.25;
            font-weight: 800;
            overflow-wrap: break-word;
        }

        .login-description {
            margin: 0 0 30px;
            color: #b9c9df;
            font-size: 15px;
            line-height: 1.7;
        }

        #loginForm {
            display: flex;
            flex-direction: column;
            gap: 17px;
            width: 100%;
            margin: 0;
        }

        #loginForm input {
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 56px;
            margin: 0;
            padding: 14px 17px;
            border: 1px solid rgba(255,255,255,.17);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,.08);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            box-shadow: none;
            transition: border-color .2s, box-shadow .2s;
        }

        #loginForm input::placeholder {
            color: #aabbd2;
            opacity: 1;
        }

        #loginForm input:focus {
            border-color: #00e676;
            box-shadow: 0 0 0 3px rgba(0,230,118,.12);
        }

        #loginForm input:-webkit-autofill,
        #loginForm input:-webkit-autofill:hover,
        #loginForm input:-webkit-autofill:focus {
            -webkit-text-fill-color: #fff;
            transition: background-color 9999s ease-in-out 0s;
        }

        .login-submit {
            display: block;
            width: 100%;
            min-height: 56px;
            margin: 5px 0 0;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(100deg, #00d66b, #00f58b);
            color: #052d1b;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }

        .login-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,230,118,.25);
        }

        .login-submit:active {
            transform: scale(.98);
        }

        .login-link {
            margin: 25px 0 0;
            color: #b9c9df;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: break-word;
        }

        .login-link a {
            color: #00ed83;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .login-footer {
            margin-top: 28px;
            color: #8296b4;
            font-size: 12px;
            line-height: 1.5;
        }

        /* Tablettes */
        @media (max-width: 768px) {
            .login-page {
                padding: 28px 20px;
            }

            .login-card {
                max-width: 480px;
            }
        }

        /* Téléphones */
        @media (max-width: 480px) {
            .login-page {
                min-height: 100svh;
                align-items: center;
                padding: 22px 15px;
            }

            .login-card {
                width: 100%;
                max-width: 100%;
                padding: 30px 22px;
                border-radius: 21px;
            }

            .login-logo {
                width: 90px;
                height: 74px;
                margin-bottom: 16px;
            }

            .login-card h1 {
                font-size: 26px;
                line-height: 1.25;
            }

            .login-description {
                font-size: 14px;
                line-height: 1.65;
                margin-bottom: 25px;
            }

            #loginForm {
                gap: 15px;
            }

            #loginForm input {
                min-height: 54px;
                padding: 13px 15px;
                font-size: 16px;
            }

            .login-submit {
                min-height: 54px;
                font-size: 16px;
            }

            .login-link {
                margin-top: 23px;
                font-size: 14px;
            }

            .login-footer {
                margin-top: 24px;
                font-size: 11px;
            }
        }

        /* Très petits téléphones */
        @media (max-width: 360px) {
            .login-page {
                padding: 16px 11px;
            }

            .login-card {
                padding: 26px 17px;
            }

            .login-card h1 {
                font-size: 24px;
            }
        }

        /* Réduction des animations si demandée par l'appareil */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <img
                src="images/logo.png"
                class="login-logo"
                alt="Logo PROF IA MEDIA"
            >

            <h1>Bienvenue !</h1>

            <p class="login-description">
                Connectez-vous à votre espace PROF IA MEDIA
                pour retrouver vos formations et votre activité.
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Adresse e-mail"
                    autocomplete="email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mot de passe"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="login-submit"
                >
                    Se connecter
                </button>

            </form>

            <p class="login-link">
                Pas encore inscrit ?
                <a href="register.html?product=formation_complete">
                    Créer un compte
                </a>
            </p>

            <div class="login-footer">
                © 2026 PROF IA MEDIA — Tous droits réservés.
            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
