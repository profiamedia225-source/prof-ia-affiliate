<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration - Retraits</title>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="dashboard">

    <div id="sidebar-container"></div>

    <main class="content">

        <section class="profile-section">

            <div class="page-header">

                <h1>
                    💳 Gestion des retraits
                </h1>

                <span id="totalWithdrawals">
                    Total : 0 demande(s)
                </span>

            </div>

<div class="filters-bar">

    <div class="filter-group">

        <label for="searchWithdrawal">
            🔍 Rechercher :
        </label>

        <input
            type="text"
            id="searchWithdrawal"
            placeholder="Nom, pays ou méthode de paiement">

    </div>

    <div class="filter-group">

        <label for="statusFilter">
            Filtrer par statut :
        </label>

        <select id="statusFilter">

            <option value="Tous">Tous</option>

            <option value="En attente">🟡 En attente</option>

            <option value="paid">🟢 Payés</option>

            <option value="Refusé">🔴 Refusés</option>

        </select>

    </div>

</div>

<div class="admin-stats-grid">

    <div class="admin-stat-card">

        <span>🟡 En attente</span>

        <h2 id="pendingCount">0</h2>

    </div>

    <div class="admin-stat-card">

        <span>🟢 Payés</span>

        <h2 id="paidCount">0</h2>

    </div>

    <div class="admin-stat-card">

        <span>🔴 Refusés</span>

        <h2 id="rejectedCount">0</h2>

    </div>

    <div class="admin-stat-card">

        <span>💰 À payer</span>

        <h2 id="pendingAmount">0 FCFA</h2>

    </div>

</div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Affilié</th>

                            <th>Pays</th>

                            <th>Montant</th>

                            <th>Méthode</th>

                            <th>Compte de paiement</th>

                            <th>Date</th>

                            <th>Statut</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="withdrawalsTable">

                    </tbody>

                </table>

            </div>

<div class="pagination-bar">

    <div class="pagination-info">
        Afficher
        <select id="rowsPerPage">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="100">100</option>
        </select>
        lignes
    </div>

    <div class="pagination-controls">

        <button id="prevPage" class="pagination-btn">
            ← Précédent
        </button>

        <span id="pageInfo">
            Page 1 sur 1
        </span>

        <button id="nextPage" class="pagination-btn">
            Suivant →
        </button>

    </div>

</div>

        </section>

    </main>

</div>

<script src="js/config.js"></script>
<script src="js/notificationService.js"></script>
<script src="js/theme.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/admin-withdrawals.js"></script>
<script src="js/sidebar.js"></script>

</body>

</html>
