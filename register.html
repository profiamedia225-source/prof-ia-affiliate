
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07152f">

    <title>Inscription | PROF IA MEDIA</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 120, 255, .20), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(0, 255, 140, .13), transparent 35%),
                linear-gradient(135deg, #061126, #0b1d3d 55%, #061126);
        }

        .register-page {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 18px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            min-width: 0;
            margin: auto;
            padding: 42px 36px;
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 24px;
            background: rgba(13, 31, 62, .92);
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
        }

        .logo {
            display: block;
            width: 110px;
            height: 90px;
            max-width: 100%;
            object-fit: contain;
            margin: 0 auto 20px;
        }

        .register-card h1 {
            margin: 0 0 14px;
            color: #fff;
            font-size: 30px;
            line-height: 1.25;
            font-weight: 800;
            overflow-wrap: break-word;
        }

        .register-card > p {
            margin: 0 0 28px;
            color: #b9c9df;
            font-size: 15px;
            line-height: 1.7;
        }

        #registerForm {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin: 0;
        }

        #registerForm > input {
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 56px;
            margin: 0;
            padding: 14px 17px;
            border: 1px solid rgba(255,255,255,.17);
            border-radius: 12px;
            outline: none;
            background: rgba(255,255,255,.08);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            box-shadow: none;
            transition: border-color .2s, box-shadow .2s;
        }

        #registerForm > input::placeholder {
            color: #aabbd2;
            opacity: 1;
        }

        #registerForm > input:focus {
            border-color: #00e676;
            box-shadow: 0 0 0 3px rgba(0,230,118,.12);
        }

        /* Case à cocher et conditions */
        #registerForm .checkbox {
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 12px;
            width: 100%;
            min-width: 0;
            margin: 4px 0 5px;
            padding: 0;
            color: #d6deeb;
            font-size: 14px;
            line-height: 1.6;
            text-align: left;
            cursor: pointer;
        }

        #registerForm .checkbox input[type="checkbox"] {
            display: block;
            flex: 0 0 20px;
            width: 20px;
            min-width: 20px;
            height: 20px;
            min-height: 20px;
            margin: 2px 0 0;
            padding: 0;
            accent-color: #00e676;
            cursor: pointer;
        }

        #registerForm .checkbox span {
            display: block;
            flex: 1 1 auto;
            min-width: 0;
            margin: 0;
            overflow-wrap: anywhere;
            word-break: normal;
        }

        .btn-primary {
            display: block;
            width: 100%;
            min-height: 56px;
            margin: 5px 0 0;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(100deg, #00d66b, #00f58b);
            color: #052d1b;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,230,118,.25);
        }

        .btn-primary:active {
            transform: scale(.98);
        }

        .login-link {
            margin: 25px 0 0;
            color: #b9c9df;
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: break-word;
        }

        .login-link a {
            color: #00ed83;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Tablettes */
        @media (max-width: 768px) {
            .register-page {
                padding: 28px 20px;
            }

            .register-card {
                max-width: 500px;
            }
        }

        /* Téléphones */
        @media (max-width: 480px) {
            .register-page {
                min-height: 100svh;
                align-items: center;
                padding: 22px 15px;
            }

            .register-card {
                width: 100%;
                max-width: 100%;
                padding: 30px 22px;
                border-radius: 21px;
            }

            .logo {
                width: 90px;
                height: 74px;
                margin-bottom: 16px;
            }

            .register-card h1 {
                font-size: 26px;
                line-height: 1.3;
            }

            .register-card > p {
                font-size: 14px;
                line-height: 1.65;
                margin-bottom: 25px;
            }

            #registerForm {
                gap: 15px;
            }

            #registerForm > input {
                min-height: 54px;
                padding: 13px 15px;
                font-size: 16px;
            }

            #registerForm .checkbox {
                gap: 11px;
                font-size: 13px;
                line-height: 1.55;
            }

            #registerForm .checkbox input[type="checkbox"] {
                flex-basis: 20px;
                width: 20px;
                min-width: 20px;
                height: 20px;
                min-height: 20px;
            }

            .btn-primary {
                min-height: 54px;
                font-size: 16px;
            }

            .login-link {
                margin-top: 23px;
                font-size: 14px;
            }
        }

        /* Très petits téléphones */
        @media (max-width: 360px) {
            .register-page {
                padding: 16px 11px;
            }

            .register-card {
                padding: 26px 17px;
            }

            .register-card h1 {
                font-size: 24px;
            }

            #registerForm .checkbox {
                font-size: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
            }
        }
    </style>

</head>

<body>

<section class="register-page">

    <div class="register-card">

        <img
            src="images/logo.png"
            class="logo"
            alt="PROF IA MEDIA"
        >

        <h1>Créer votre compte affilié</h1>

        <p>
            Rejoignez le programme d'affiliation PROF IA MEDIA
            et commencez à gagner des commissions.
        </p>

        <form id="registerForm">

            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Nom et prénom"
                autocomplete="name"
                required
            >

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Adresse e-mail"
                autocomplete="email"
                required
            >

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Téléphone WhatsApp"
                autocomplete="tel"
                required
            >

            <input
                type="text"
                id="country"
                name="country"
                placeholder="Pays"
                autocomplete="country-name"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Mot de passe"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirmer le mot de passe"
                autocomplete="new-password"
                required
            >

            <label class="checkbox" for="terms">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required
                >

                <span>
                    J'accepte les conditions d'utilisation.
                </span>

            </label>

            <button
                type="submit"
                class="btn-primary"
            >
                Créer mon compte
            </button>

        </form>

        <p class="login-link">
            Déjà inscrit ?
            <a href="login.html?product=formation_complete">
                Se connecter
            </a>
        </p>

    </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/referral.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
