
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mes filleuls - PROF IA MEDIA</title>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* ==========================================
   RESPONSIVE - PAGE MES FILLEULS
   PROF IA MEDIA PARTNERS
   ========================================== */

/* BASE */

.content,
.profile-section,
.table-container {
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
}

.profile-section {
    width: 100%;
}

/* CONTENEUR DU TABLEAU */

.table-container {
    width: 100%;
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #8295b5 #edf1f7;
    border-radius: 12px;
}

.table-container::-webkit-scrollbar {
    height: 9px;
}

.table-container::-webkit-scrollbar-track {
    background: #edf1f7;
    border-radius: 10px;
}

.table-container::-webkit-scrollbar-thumb {
    background: #8295b5;
    border: 2px solid #edf1f7;
    border-radius: 10px;
}

.table-container .table {
    width: 100%;
    min-width: 680px;
    border-collapse: collapse;
}

/* TABLETTES */

@media (max-width: 1024px) {

    .content {
        min-width: 0;
    }

    .top-header {
        flex-wrap: wrap;
        gap: 10px 16px;
    }

    .top-header h1 {
        font-size: clamp(1.25rem, 2.5vw, 1.7rem);
        overflow-wrap: anywhere;
    }

}

/* TELEPHONES */

@media (max-width: 768px) {

    .content {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        padding: 75px 16px 24px;
        margin: 0;
        box-sizing: border-box;
    }

    .top-header {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: 8px;
        padding: 16px;
        margin: 0 0 16px;
        box-sizing: border-box;
    }

    .top-header h1 {
        margin: 0;
        font-size: clamp(1.2rem, 5vw, 1.5rem);
        line-height: 1.3;
    }

    #totalReferrals {
        margin: 0;
        font-size: .95rem;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    .profile-section {
        width: 100%;
        margin: 0;
        padding: 0;
    }

    .table-container {
        width: 100%;
        max-width: 100%;
        margin: 0;
        border-radius: 12px;
    }

    .table-container .table {
        min-width: 650px;
        font-size: .9rem;
    }

    .table-container .table th,
    .table-container .table td {
        padding: 11px 12px;
        white-space: nowrap;
    }

}

/* PETITS TELEPHONES */

@media (max-width: 480px) {

    .content {
        padding: 72px 12px 20px;
    }

    .top-header {
        padding: 14px;
        margin-bottom: 12px;
        border-radius: 14px;
    }

    .top-header h1 {
        font-size: 1.2rem;
    }

    #totalReferrals {
        font-size: .88rem;
    }

    .table-container .table {
        min-width: 620px;
        font-size: .84rem;
    }

    .table-container .table th,
    .table-container .table td {
        padding: 10px;
    }

}

/* TRES PETITS TELEPHONES */

@media (max-width: 360px) {

    .content {
        padding-right: 9px;
        padding-left: 9px;
    }

    .top-header {
        padding: 12px;
    }

}

</style>

</head>

<body>

<div class="dashboard">

    <div id="sidebar-container"></div>

    <!-- CONTENU PRINCIPAL -->

    <main class="content">

        <header class="top-header">

            <h1>👥 Mes filleuls</h1>

            <p id="totalReferrals">
                Total : 0 filleul
            </p>

        </header>

        <section class="profile-section">

            <div class="table-container">

                <table class="table">

                    <thead>

                        <tr>
                            <th>N°</th>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Pays</th>
                            <th>Date</th>
                            <th>Statut</th>
                        </tr>

                    </thead>

                    <tbody id="referralsBody">

                        <tr id="loadingRow">

                            <td colspan="6"
                                style="text-align:center;padding:40px;">

                                Chargement des filleuls...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<!-- SCRIPTS EXISTANTS -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/notificationService.js"></script>

<script src="js/theme.js"></script>

<script src="js/utils.js"></script>

<script src="js/auth.js"></script>

<script src="js/referrals.js"></script>

<script src="js/sidebar.js"></script>

</body>

</html>
